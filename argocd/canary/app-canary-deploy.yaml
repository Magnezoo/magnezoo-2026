apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnezoo-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magnezoo
      version: canary
  template:
    metadata:
      labels:
        app: magnezoo
        version: canary
    spec:
      containers:
        - name: magnezoo
          image: registry.uniproject.jp/nnn/magnezoo:0.2.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: magnezoo-secret
          volumeMounts:
            - name: app-image-storage
              mountPath: /app/public/img/posts
          readinessProbe:
            httpGet:
              path: /
              port: 3000
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: internal-harbor
      volumes:
        - name: app-image-storage
          persistentVolumeClaim:
            claimName: app-image-pvc
