---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: magnezoo-2026
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-secret
      namespace: magnezoo-2026
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: magnezoo-secret
  namespace: magnezoo-2026
spec:
  encryptedData:
    BETTER_AUTH_SECRET: 
    DATABASE_URL: 
    GOOGLE_CLIENT_ID: 
    GOOGLE_CLIENT_SECRET: 
    NEXT_PUBLIC_BETTER_AUTH_URL: 
  template:
    metadata:
      name: magnezoo-secret
      namespace: magnezoo-2026
    type: Opaque
